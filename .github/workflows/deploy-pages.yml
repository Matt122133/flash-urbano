name: Deploy a GitHub Pages

# Publica la web de clientes (web/) como sitio estatico en GitHub Pages.
# Requiere habilitar Pages una sola vez en el repo:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Sin ese paso, el job de deploy falla aunque el build este bien.

on:
  push:
    branches: [mvp-flash-urbano, master]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  # Permite lanzarlo a mano desde la pestania Actions.
  workflow_dispatch:

# Permisos que necesita actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se pushea dos veces seguidas, que la segunda corrida cancele la primera
# en vez de pisarse entre ellas.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build estatico
        # GITHUB_PAGES activa output:export + basePath en next.config.ts.
        #
        # Las dos NEXT_PUBLIC_ se inyectan en el bundle en tiempo de build. Van
        # como *variables* de repositorio (vars) y no como secretos (secrets),
        # y es deliberado: las dos terminan dentro del JavaScript que cualquiera
        # puede leer, asi que tratarlas de secretas seria mentirse. Ninguna de
        # las dos lo es — el Client ID de Google es publico por diseno.
        #
        # Estan aca y no escritas en el codigo por FR-024: mudar el sitio a
        # flashurbano.uy, o rotar el cliente OAuth, tiene que ser cambiar una
        # variable y no editar pantallas.
        #
        # Configurarlas en: Settings -> Secrets and variables -> Actions ->
        # Variables. Si NEXT_PUBLIC_API_URL falta, el sitio compila igual pero
        # el ingreso falla con "el sitio no tiene configurada la direccion del
        # servicio", que es el mensaje que lib/api.ts da para este caso.
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
